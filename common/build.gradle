plugins {
    id 'java-library'
}

// Tarea para compilar Slice a Java antes de compilar el codigo fuente
task compileSlice(type: Exec) {
    description = 'Compila Chat.ice a codigo fuente Java usando slice2java'
    workingDir projectDir
    doFirst {
        file("src/main/java").mkdirs()
    }
    commandLine 'slice2java', '--output-dir', 'src/main/java', 'src/main/slice/Chat.ice'
}

compileJava.dependsOn compileSlice